apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-express-app
  namespace: my-app-dev
spec:
  minReadySeconds: 5
  replicas: 2
  selector: 
    matchLabels:
      app: my-express-app
  template: 
    metadata:
      labels:
        app: my-express-app
    spec: 
      containers:
        - name: my-express-app
          image: anhv806/express-k8s-demo:latest
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"



  
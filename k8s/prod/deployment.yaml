apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-express-app-prod
  namespace: my-app-prod
spec: 
  replicas: 3
  selector:
    matchLabels:
      app: my-express-app
  template:
    metadata:
      labels:
        app: my-express-app
    spec:
      containers:
        - name: express-k8s-demo
          image: anhv806/express-k8s-demo:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"